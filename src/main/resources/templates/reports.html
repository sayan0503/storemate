<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>StoreMate - Dashboard</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            color: #1f2937;
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        .layout {
            display: flex;
            min-height: 100vh;
        }

        /* Sidebar */

        .sidebar {
            width: 240px;
            background: #111827;
            color: white;
            padding: 25px 18px;
            flex-shrink: 0;
        }

        .logo {
            font-size: 25px;
            font-weight: bold;
            padding: 0 12px 35px;
        }

        .logo span {
            font-weight: normal;
        }

        .nav-item {
            display: block;
            padding: 13px 14px;
            margin-bottom: 6px;
            border-radius: 8px;
            color: #d1d5db;
        }

        .nav-item:hover,
        .nav-item.active {
            background: #374151;
            color: white;
        }

        /* Main */

        .main {
            flex: 1;
        }

        .topbar {
            height: 72px;
            background: white;
            border-bottom: 1px solid #e5e7eb;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            padding: 0 35px;
        }

		.topbar-user {
		    display: flex;
		    align-items: center;
		    gap: 20px;
		}

		.user-name {
		    font-weight: 600;
			padding-right: 10px;
		}

		.logout-button {
		    padding: 9px 16px;
		    border: 1px solid #d1d5db;
		    border-radius: 7px;
		    background: white;
		    color: #374151;
		    font-size: 14px;
		    font-weight: 600;
		    cursor: pointer;
		}

		.logout-button:hover {
		    background: #f3f4f6;
		} 

        .content {
            padding: 35px;
        }

		/* Reports */

		.reports-section {
		    margin-top: 40px;
			padding: 30px;
		}

		.reports-header {
		    margin-bottom: 20px;
		}

		.reports-header h2 {
		    font-size: 22px;
		}

		.report-stats {
		    display: grid;
		    grid-template-columns: repeat(3, 1fr);
		    gap: 20px;
		    margin-bottom: 25px;
		}

		.report-card {
		    background: white;
		    border: 1px solid #e5e7eb;
		    border-radius: 12px;
		    padding: 24px;
		}

		.report-card p {
		    color: #6b7280;
		    font-size: 14px;
		    margin-bottom: 10px;
		}

		.report-card h2 {
		    font-size: 26px;
		    margin-bottom: 8px;
		}

		.report-description {
		    color: #6b7280;
		    font-size: 13px;
		}


		/* Store Reports */

		.store-reports {
		    display: flex;
		    flex-direction: column;
		    gap: 20px;
			padding: 20px;
		}

		.store-report {
		    background: white;
		    border: 1px solid #e5e7eb;
		    border-radius: 12px;
		    padding: 24px;
		}

		.store-report h3 {
		    font-size: 18px;
		    margin-bottom: 20px;
		}

		.store-report-details {
		    display: grid;
		    grid-template-columns: repeat(3, 1fr);
		    gap: 20px;
		}

		.report-detail {
		    display: flex;
		    flex-direction: column;
		    gap: 7px;
		}

		.report-detail span {
		    color: #6b7280;
		    font-size: 13px;
		}

		.report-detail strong {
		    font-size: 18px;
		}

		.report-detail small {
		    color: #6b7280;
		    font-size: 13px;
		}

        /* Responsive */

        @media (max-width: 800px) {

            .sidebar {
                width: 190px;
            }

            .stats {
                grid-template-columns: 1fr;
            }

            .content {
                padding: 25px;
            }
			
			.report-stats {
			        grid-template-columns: 1fr;
		    }

			.store-report-details {
		        grid-template-columns: 1fr;
		    }
        }

        @media (max-width: 600px) {

            .sidebar {
                display: none;
            }

            .content {
                padding: 20px;
            }

            .topbar {
                padding: 0 20px;
            }
        }

    </style>

</head>

<body>

<div class="layout">

    <!-- Sidebar -->

    <aside class="sidebar">

        <div class="logo">
            Store<span>Mate</span>
        </div>

        <a href="/dashboard" class="nav-item">
            Dashboard
        </a>

        <a href="/allInventory" class="nav-item">
            Inventory
        </a>

        <a href="/reports" class="nav-item active">
            Reports
        </a>

		<a th:href="@{/user/{id}(id=${session.user.id})}" class="nav-item">
		    Account
		</a>
				
		<a href="/aboutus" class="nav-item">
			About Us
		</a>

    </aside>


    <!-- Main -->

    <main class="main">
		
		<!-- Topbar -->

		       <header class="topbar">

		           <span class="user-name"
		                 th:text="${session.user.name}">
		               User
		           </span>
				
				<a href="/logout" class="logout-button">
				    Logout
				</a>

		       </header>
		
		<!-- Reports -->

		<div class="reports-section">

		    <div class="reports-header">
		        <h2>Reports</h2>
		    </div>


		    <!-- Overall Reports -->

		    <div class="report-stats">

		        <div class="report-card">

		            <p>Total Revenue</p>

		            <h2>
		                ₹<span th:text="${totalRevenue}">0</span>
		            </h2>

		            <span class="report-description">
		                All stores combined
		            </span>

		        </div>


		        <div class="report-card">

		            <p>Total Profit</p>

		            <h2>
		                ₹<span th:text="${totalProfit}">0</span>
		            </h2>

		            <span class="report-description">
		                All stores combined
		            </span>

		        </div>


		        <div class="report-card">

		            <p>Most Selling Item</p>

		            <h2 th:if="${mostSellingProduct != null}"
		                th:text="${mostSellingProduct.productName}">
		                -
		            </h2>

		            <h2 th:if="${mostSellingProduct == null}">
		                No sales
		            </h2>

		            <span class="report-description"
		                  th:if="${mostSellingProduct != null}">
		                Quantity:
		                <span th:text="${mostSellingProduct.totalQty}">
		                    0
		                </span>
		            </span>

		        </div>

		    </div>


		    <!-- Store Reports -->

		    <div class="store-reports">

		        <div class="store-report"
		             th:each="store : ${stores}">

		            <h3 th:text="${store.name}">
		                Store Name
		            </h3>


		            <div class="store-report-details">

		                <div class="report-detail">

		                    <span>Revenue</span>

		                    <strong>
		                        ₹<span th:text="${storeReport[store.id].revenue}">
		                            0
		                        </span>
		                    </strong>

		                </div>


		                <div class="report-detail">

		                    <span>Profit</span>

		                    <strong>
		                        ₹<span th:text="${storeReport[store.id].profit}">
		                            0
		                        </span>
		                    </strong>

		                </div>


		                <div class="report-detail">

		                    <span>Most Selling Item</span>

		                    <strong th:text="${storeReport[store.id].mostSellingItem}">
		                        -
		                    </strong>

		                    <small>
		                        Quantity:
		                        <span th:text="${storeReport[store.id].mostSellingQuantity}">
		                            0
		                        </span>
		                    </small>

		                </div>

		            </div>

		        </div>

		    </div>

		</div>

    </main>

</div>

</body>

</html>
