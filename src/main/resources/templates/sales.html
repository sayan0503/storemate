<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StoreMate - Sales History</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            color: #1f2937;
            min-height: 100vh;
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        .navbar {
            height: 72px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 7%;
            background: white;
            border-bottom: 1px solid #e5e7eb;
        }

        .logo {
            font-size: 25px;
            font-weight: bold;
        }

        .logo span {
            font-weight: normal;
        }

        .back-link {
            color: #4b5563;
            font-size: 15px;
        }

        .main {
            max-width: 1200px;
            margin: auto;
            padding: 45px 30px;
        }

        .page-header {
            margin-bottom: 30px;
        }

        .page-heading h1 {
            font-size: 32px;
            margin-bottom: 8px;
        }

        .page-heading p {
            color: #6b7280;
            font-size: 15px;
        }

        .sales-card {
            background: white;
            border: 1px solid #e5e7eb;
            border-radius: 14px;
            overflow: hidden;
        }

        .sales-table {
            width: 100%;
            border-collapse: collapse;
        }

        .sales-table th {
            text-align: left;
            padding: 17px 20px;
            background: #f9fafb;
            border-bottom: 1px solid #e5e7eb;
            font-size: 13px;
            color: #6b7280;
        }

        .sales-table td {
            padding: 18px 20px;
            border-bottom: 1px solid #f0f0f0;
            font-size: 14px;
        }

        .sales-table tr:last-child td {
            border-bottom: none;
        }

        .sale-id {
            font-weight: 600;
        }

        .sale-total {
            font-weight: bold;
        }

        .view-button {
            padding: 7px 12px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            background: white;
            color: #374151;
            font-size: 13px;
        }

        .view-button:hover {
            background: #f3f4f6;
        }

        .empty-sales {
            text-align: center;
            padding: 70px 20px;
        }

        .empty-sales h2 {
            font-size: 21px;
            margin-bottom: 10px;
        }

        .empty-sales p {
            color: #6b7280;
            font-size: 14px;
        }

        @media (max-width: 700px) {

            .main {
                padding: 30px 15px;
            }

            .sales-card {
                overflow-x: auto;
            }

            .sales-table {
                min-width: 700px;
            }

        }

    </style>

</head>

<body>

<header class="navbar">

    <a href="/dashboard" class="logo">
        Store<span>Mate</span>
    </a>

    <a th:href="@{/store/{id}(id=${store.id})}" class="back-link">
        ← Back to Store
    </a>

</header>

<main class="main">

    <div class="page-header">

        <div class="page-heading">

            <h1>Sales History</h1>

            <p>
                <span th:text="${store.name}">
                    Store Name
                </span>
                · View previous sales
            </p>

        </div>

    </div>

    <div class="sales-card">

        <table class="sales-table"
               th:if="${sales != null and !#lists.isEmpty(sales)}">

            <thead>

                <tr>

                    <th>Sale ID</th>
                    <th>Date</th>
                    <th>Total</th>
                    <th>Action</th>

                </tr>

            </thead>

            <tbody>

                <tr th:each="sale : ${sales}">

                    <td class="sale-id"
                        th:text="${sale.id}">
                        1
                    </td>

                    <td th:text="${sale.saleDate}">
                        2026-08-22 20:15
                    </td>

                    <td class="sale-total">
                        ₹<span th:text="${sale.totalAmount}">
                            450.00
                        </span>
                    </td>

                    <td>

                        <a th:href="@{/store/{storeId}/sales/{saleId}(storeId=${store.id}, saleId=${sale.id})}"
                           class="view-button">
                            View Details
                        </a>

                    </td>

                </tr>

            </tbody>

        </table>

        <div class="empty-sales"
             th:if="${sales == null or #lists.isEmpty(sales)}">

            <h2>No sales yet</h2>

            <p>
                Completed sales will appear here.
            </p>

        </div>

    </div>

</main>

</body>

</html>
