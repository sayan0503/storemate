<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>StoreMate - Register</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            color: #1f2937;
            min-height: 100vh;
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        /* Navbar */

        .navbar {
            height: 72px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 7%;
            background: white;
            border-bottom: 1px solid #e5e7eb;
        }

        .logo {
            font-size: 25px;
            font-weight: bold;
        }

        .logo span {
            font-weight: normal;
        }

        .login-link {
            color: #4b5563;
            font-size: 15px;
        }

        .login-link:hover {
            color: #111827;
        }

        /* Register Section */

        .register-section {
            min-height: calc(100vh - 72px);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 50px 20px;
        }

        .register-container {
            width: 100%;
            max-width: 460px;
        }

        .register-heading {
            text-align: center;
            margin-bottom: 30px;
        }

        .register-heading h1 {
            font-size: 34px;
            margin-bottom: 10px;
        }

        .register-heading p {
            color: #6b7280;
            font-size: 15px;
        }

        /* Form Card */

        .register-card {
            background: white;
            padding: 35px;
            border-radius: 14px;
            border: 1px solid #e5e7eb;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.07);
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .form-group input {
            width: 100%;
            padding: 13px 14px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
            transition: border-color 0.2s;
        }

        .form-group input:focus {
            border-color: #111827;
        }

        .register-button {
            width: 100%;
            padding: 14px;
            margin-top: 5px;
            border: none;
            border-radius: 8px;
            background: #111827;
            color: white;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }

        .register-button:hover {
            background: #374151;
        }

        /* Login */

        .login-text {
            text-align: center;
            margin-top: 22px;
            color: #6b7280;
            font-size: 14px;
        }

        .login-text a {
            color: #111827;
            font-weight: bold;
        }

        /* Error / Success */

        .message {
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 14px;
        }

        .error-message {
            background: #fee2e2;
            color: #991b1b;
        }

        .success-message {
            background: #dcfce7;
            color: #166534;
        }

        /* Mobile */

        @media (max-width: 600px) {

            .navbar {
                padding: 0 5%;
            }

            .login-link {
                display: none;
            }

            .register-section {
                padding: 30px 15px;
            }

            .register-card {
                padding: 25px 20px;
            }

            .register-heading h1 {
                font-size: 29px;
            }
        }

    </style>

</head>

<body>


<!-- Navbar -->

<header class="navbar">

    <a href="/" class="logo">
        Store<span>Mate</span>
    </a>

    <a href="/goLogin" class="login-link">
        Already have an account? Login
    </a>

</header>


<!-- Register Section -->

<section class="register-section">

    <div class="register-container">


        <!-- Heading -->

        <div class="register-heading">

            <h1>
                Create your account
            </h1>

            <p>
                Start managing your store with StoreMate.
            </p>

        </div>


        <!-- Register Card -->

        <div class="register-card">


            <!-- Error message -->

            <div
                th:if="${error}"
                class="message error-message"
                th:text="${error}">
            </div>


            <!-- Success message -->

            <div
                th:if="${success}"
                class="message success-message"
                th:text="${success}">
            </div>


            <form
                th:action="@{/registerForm}" th:object="${User}" method="post">


                <!-- Name -->

                <div class="form-group">

                    <label for="name">
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="name"
                        name="name"
						th:field="*{name}"
                        placeholder="Enter your name"
                        required>

                </div>


                <!-- Email -->

                <div class="form-group">

                    <label for="email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
						th:field="*{email}"
                        placeholder="Enter your email"
                        required>

                </div>


                <!-- Password -->

                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
						th:field="*{password}"
                        placeholder="Create a password"
                        required>

                </div>


                <!-- Confirm Password -->

                <div class="form-group">

                    <label for="confirmPassword">
                        Confirm Password
                    </label>

                    <input
                        type="password"
                        id="confirmPassword"
                        name="confirmPassword"
                        placeholder="Confirm your password"
                        required>

                </div>


                <!-- Register -->

                <button
                    type="submit"
                    class="register-button">

                    Create Account

                </button>

            </form>


            <!-- Login -->

            <div class="login-text">

                Already have an account?

                <a href="/goLogin">
                    Login
                </a>

            </div>


        </div>

    </div>

</section>

</body>

</html>
```
