<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>StoreMate - Add Store</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            color: #1f2937;
            min-height: 100vh;
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        .navbar {
            height: 72px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 7%;
            background: white;
            border-bottom: 1px solid #e5e7eb;
        }

        .logo {
            font-size: 25px;
            font-weight: bold;
        }

        .logo span {
            font-weight: normal;
        }

        .back-link {
            color: #4b5563;
            font-size: 15px;
        }

        .back-link:hover {
            color: #111827;
        }

        .store-section {
            min-height: calc(100vh - 72px);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 50px 20px;
        }

        .store-container {
            width: 100%;
            max-width: 500px;
        }

        .heading {
            text-align: center;
            margin-bottom: 30px;
        }

        .heading h1 {
            font-size: 34px;
            margin-bottom: 10px;
        }

        .heading p {
            color: #6b7280;
            font-size: 15px;
        }

        .store-card {
            background: white;
            padding: 35px;
            border-radius: 14px;
            border: 1px solid #e5e7eb;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.07);
        }

        .form-group {
            margin-bottom: 22px;
        }

        .form-group label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .form-group input {
            width: 100%;
            padding: 13px 14px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
        }

        .form-group input:focus {
            border-color: #111827;
        }

        .create-button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: #111827;
            color: white;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }

        .create-button:hover {
            background: #374151;
        }

        .message {
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 14px;
        }

        .error-message {
            background: #fee2e2;
            color: #991b1b;
        }

        @media (max-width: 600px) {

            .navbar {
                padding: 0 5%;
            }

            .back-link {
                display: none;
            }

            .store-section {
                padding: 30px 15px;
            }

            .store-card {
                padding: 25px 20px;
            }

            .heading h1 {
                font-size: 29px;
            }

        }

    </style>

</head>

<body>

<header class="navbar">

    <a href="/dashboard" class="logo">
        Store<span>Mate</span>
    </a>

    <a href="/dashboard" class="back-link">
        ← Back to Dashboard
    </a>

</header>


<section class="store-section">

    <div class="store-container">

        <div class="heading">

            <h1>
                Create a Store
            </h1>

            <p>
                Add a new store to your StoreMate account.
            </p>

        </div>


        <div class="store-card">

            <div th:if="${error}" class="message error-message" th:text="${error}">
            </div>


            <form th:action="@{/store/add}" th:object="${store}" method="post">

                <div class="form-group">

                    <label for="name">
                        Store Name
                    </label>

                    <input type="text"
                           id="name"
                           th:field="*{name}"
                           placeholder="Enter store name"
                           required>

                </div>


                <button type="submit" class="create-button">
                    Create Store
                </button>

            </form>

        </div>

    </div>

</section>

</body>

</html>
