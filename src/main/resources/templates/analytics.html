<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>StoreMate - Analytics</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            color: #1f2937;
            min-height: 100vh;
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        /* Navbar */

        .navbar {
            height: 72px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 7%;
            background: white;
            border-bottom: 1px solid #e5e7eb;
        }

        .logo {
            font-size: 25px;
            font-weight: bold;
        }

        .logo span {
            font-weight: normal;
        }

        .back-link {
            color: #4b5563;
            font-size: 15px;
        }

        .back-link:hover {
            color: #111827;
        }

        /* Main */

        .main {
            max-width: 1200px;
            margin: auto;
            padding: 45px 30px;
        }

        .page-header {
            margin-bottom: 30px;
        }

        .page-header h1 {
            font-size: 32px;
            margin-bottom: 8px;
        }

        .page-header p {
            color: #6b7280;
            font-size: 15px;
        }

        /* Statistics */

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 18px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: white;
            border: 1px solid #e5e7eb;
            border-radius: 12px;
            padding: 25px;
        }

        .stat-label {
            color: #6b7280;
            font-size: 14px;
            margin-bottom: 12px;
        }

        .stat-value {
            font-size: 27px;
            font-weight: bold;
        }

        /* Sections */

        .section-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 25px;
        }

        .card {
            background: white;
            border: 1px solid #e5e7eb;
            border-radius: 14px;
            overflow: hidden;
        }

        .card-header {
            padding: 20px;
            border-bottom: 1px solid #e5e7eb;
        }

        .card-header h2 {
            font-size: 18px;
        }

        /* Tables */

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            text-align: left;
            padding: 14px 18px;
            background: #f9fafb;
            color: #6b7280;
            font-size: 12px;
        }

        td {
            padding: 15px 18px;
            border-bottom: 1px solid #f0f0f0;
            font-size: 14px;
        }

        tr:last-child td {
            border-bottom: none;
        }

        .product-name {
            font-weight: 600;
        }

        .amount {
            font-weight: 600;
        }

        .empty {
            text-align: center;
            padding: 40px 20px;
            color: #6b7280;
            font-size: 14px;
        }

        /* Responsive */

        @media(max-width: 900px) {

            .stats-grid {
                grid-template-columns: repeat(2, 1fr);
            }

            .section-grid {
                grid-template-columns: 1fr;
            }

        }

        @media(max-width: 600px) {

            .navbar {
                padding: 0 5%;
            }

            .main {
                padding: 30px 15px;
            }

            .stats-grid {
                grid-template-columns: 1fr;
            }

            .page-header h1 {
                font-size: 27px;
            }

        }

    </style>

</head>


<body>

<header class="navbar">

    <a href="/dashboard" class="logo">
        Store<span>Mate</span>
    </a>

    <a th:href="@{/store/{id}(id=${store.id})}"
       class="back-link">

        ← Back to Store

    </a>

</header>


<main class="main">

    <!-- Header -->

    <div class="page-header">

        <h1>Analytics</h1>

        <p>

            <span th:text="${store.name}">
                Store Name
            </span>

            · Business performance overview

        </p>

    </div>


    <!-- Statistics -->

    <div class="stats-grid">

        <div class="stat-card">

            <div class="stat-label">
                Total Revenue
            </div>

            <div class="stat-value">

                ₹<span th:text="${analytics.totalRevenue}">
                    0.00
                </span>

            </div>

        </div>


        <div class="stat-card">

            <div class="stat-label">
                Total Profit
            </div>

            <div class="stat-value">

                ₹<span th:text="${analytics.totalProfit}">
                    0.00
                </span>

            </div>

        </div>


        <div class="stat-card">

            <div class="stat-label">
                Total Sales
            </div>

            <div class="stat-value"
                 th:text="${analytics.totalSales}">

                0

            </div>

        </div>


        <div class="stat-card">

            <div class="stat-label">
                Items Sold
            </div>

            <div class="stat-value"
                 th:text="${analytics.itemSold}">

                0

            </div>

        </div>

    </div>


    <!-- Tables -->

    <div class="section-grid">


        <!-- Top Products -->

        <div class="card">

            <div class="card-header">

                <h2>
                    Top Selling Products
                </h2>

            </div>


            <table
                th:if="${analytics.topProducts != null
                        and !#lists.isEmpty(analytics.topProducts)}">

                <thead>

                    <tr>

                        <th>
                            Product
                        </th>

                        <th>
                            Quantity Sold
                        </th>

                        <th>
                            Revenue
                        </th>

                    </tr>

                </thead>


                <tbody>

                    <tr th:each="product : ${topProducts}">

                        <td class="product-name"
                            th:text="${product.productName}">

                            Product

                        </td>

                        <td th:text="${product.totalQty}">

                            0

                        </td>

                        <td class="amount">

                            ₹<span
	                                th:text="${product.revenue}">
                                0.00
                            </span>

                        </td>

                    </tr>

                </tbody>

            </table>


            <div class="empty"
                 th:if="${analytics.topProducts == null
                         or #lists.isEmpty(analytics.topProducts)}">

                No sales yet.

            </div>

        </div>


        <!-- Recent Sales -->

        <div class="card">

            <div class="card-header">

                <h2>
                    Recent Sales
                </h2>

            </div>


            <table
                th:if="${analytics.recentSales != null
                        and !#lists.isEmpty(analytics.recentSales)}">

                <thead>

                    <tr>

                        <th>
                            Sale ID
                        </th>

                        <th>
                            Date
                        </th>

                        <th>
                            Amount
                        </th>

                    </tr>

                </thead>


                <tbody>

                    <tr th:each="sale : ${analytics.recentSales}">

                        <td>
                            #<span th:text="${sale.id}">
                                1
                            </span>
                        </td>

                        <td th:text="${#temporals.format(
                            sale.saleDate,
                            'dd MMM yyyy HH:mm'
                        )}">

                            Date

                        </td>

                        <td class="amount">

                            ₹<span th:text="${sale.totalAmount}">
                                0.00
                            </span>

                        </td>

                    </tr>

                </tbody>

            </table>


            <div class="empty"
                 th:if="${analytics.recentSales == null
                         or #lists.isEmpty(analytics.recentSales)}">

                No sales yet.

            </div>

        </div>

    </div>

</main>

</body>

</html>
