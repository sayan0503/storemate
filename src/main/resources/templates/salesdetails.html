<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>StoreMate - Sale Details</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            color: #1f2937;
            min-height: 100vh;
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        /* Navbar */

        .navbar {
            height: 72px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 7%;
            background: white;
            border-bottom: 1px solid #e5e7eb;
        }

        .logo {
            font-size: 25px;
            font-weight: bold;
        }

        .logo span {
            font-weight: normal;
        }

        .back-link {
            color: #4b5563;
            font-size: 15px;
        }

        .back-link:hover {
            color: #111827;
        }

        /* Main */

        .main {
            max-width: 1100px;
            margin: auto;
            padding: 45px 30px;
        }

        /* Header */

        .page-header {
            margin-bottom: 30px;
        }

        .page-heading h1 {
            font-size: 32px;
            margin-bottom: 8px;
        }

        .page-heading p {
            color: #6b7280;
            font-size: 15px;
        }

        /* Sale Info */

        .sale-info {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 25px;
        }

        .info-card {
            background: white;
            border: 1px solid #e5e7eb;
            border-radius: 12px;
            padding: 20px;
        }

        .info-label {
            color: #6b7280;
            font-size: 13px;
            margin-bottom: 7px;
        }

        .info-value {
            font-size: 18px;
            font-weight: bold;
        }

        /* Items Card */

        .items-card {
            background: white;
            border: 1px solid #e5e7eb;
            border-radius: 14px;
            overflow: hidden;
        }

        .items-table {
            width: 100%;
            border-collapse: collapse;
        }

        .items-table th {
            text-align: left;
            padding: 17px 20px;
            background: #f9fafb;
            border-bottom: 1px solid #e5e7eb;
            font-size: 13px;
            color: #6b7280;
            font-weight: 600;
        }

        .items-table td {
            padding: 18px 20px;
            border-bottom: 1px solid #f0f0f0;
            font-size: 14px;
        }

        .items-table tr:last-child td {
            border-bottom: none;
        }

        .product-name {
            font-weight: 600;
        }

        .product-id {
            color: #6b7280;
        }

        .quantity {
            font-weight: 600;
        }

        .price {
            font-weight: 600;
        }

        .subtotal {
            font-weight: 600;
        }

        /* Total */

        .total-section {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            gap: 20px;
            padding: 22px 20px;
            border-top: 1px solid #e5e7eb;
        }

        .total-label {
            color: #6b7280;
            font-size: 14px;
        }

        .total-amount {
            font-size: 25px;
            font-weight: bold;
        }

        /* Empty */

        .empty-items {
            text-align: center;
            padding: 60px 20px;
        }

        .empty-items h2 {
            font-size: 21px;
            margin-bottom: 10px;
        }

        .empty-items p {
            color: #6b7280;
            font-size: 14px;
        }

        /* Responsive */

        @media (max-width: 700px) {

            .main {
                padding: 30px 15px;
            }

            .sale-info {
                grid-template-columns: 1fr;
            }

            .items-card {
                overflow-x: auto;
            }

            .items-table {
                min-width: 700px;
            }

        }

        @media (max-width: 600px) {

            .navbar {
                padding: 0 5%;
            }

            .back-link {
                font-size: 14px;
            }

            .page-heading h1 {
                font-size: 28px;
            }

        }

    </style>

</head>

<body>

<header class="navbar">

    <a href="/dashboard" class="logo">
        Store<span>Mate</span>
    </a>

    <a th:href="@{/store/{id}/sales(id=${store.id})}" class="back-link">
        ← Back to Sales
    </a>

</header>


<main class="main">

    <div class="page-header">

        <div class="page-heading">

            <h1>
                Sale Details
            </h1>

            <p>
                <span th:text="${store.name}">
                    Store Name
                </span>
                · Sale #<span th:text="${sale.id}">
                    1
                </span>
            </p>

        </div>

    </div>


    <div class="sale-info">

        <div class="info-card">

            <div class="info-label">
                Sale ID
            </div>

            <div class="info-value"
                 th:text="'#' + ${sale.id}">
                #1
            </div>

        </div>


        <div class="info-card">

            <div class="info-label">
                Sale Date
            </div>

            <div class="info-value"
                 th:text="${sale.saleDate}">
                2026-08-22 20:15
            </div>

        </div>

    </div>


    <div class="items-card">

        <table class="items-table"
               th:if="${items != null and !#lists.isEmpty(items)}">

            <thead>

                <tr>

                    <th>
                        Product ID
                    </th>

                    <th>
                        Product
                    </th>

                    <th>
                        Quantity
                    </th>

                    <th>
                        Price
                    </th>

                    <th>
                        Subtotal
                    </th>

                </tr>

            </thead>


            <tbody>

                <tr th:each="item : ${items}">

                    <td class="product-id"
                        th:text="${item.product.id}">
                        1
                    </td>

                    <td class="product-name"
                        th:text="${item.product.name}">
                        Product Name
                    </td>

                    <td class="quantity"
                        th:text="${item.quantity}">
                        2
                    </td>

                    <td class="price">
                        ₹<span th:text="${item.price}">
                            100.00
                        </span>
                    </td>

                    <td class="subtotal">
                        ₹<span th:text="${item.subTotal}">
                            200.00
                        </span>
                    </td>

                </tr>

            </tbody>

        </table>


        <div class="empty-items"
             th:if="${items == null or #lists.isEmpty(items)}">

            <h2>
                No items found
            </h2>

            <p>
                This sale does not contain any products.
            </p>

        </div>


        <div class="total-section">

            <span class="total-label">
                Total Sale:
            </span>

            <span class="total-amount">
                ₹<span th:text="${sale.totalAmount}">
                    0.00
                </span>
            </span>

        </div>

    </div>

</main>

</body>

</html>
